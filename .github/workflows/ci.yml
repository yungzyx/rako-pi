name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Lunes 07:00 UTC — corrida semanal anti-flakiness (job stress).
    - cron: "0 7 * * 1"

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          # Force fake LLM and skip vault lookups.
          ANTHROPIC_API_KEY: ""
          OBSIDIAN_VAULT_PATH: ./this-path-does-not-exist
        run: python scripts/checks.py test

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint + format + hygiene
        run: |
          python scripts/checks.py lint
          python scripts/checks.py hygiene

  safety-fixtures:
    # Tests del detector de crisis nunca pueden regresionar.
    # Job dedicado para que un fallo aquí sea visible y bloquee el merge
    # incluso si alguien afloja `--cov-fail-under`.
    name: safety fixtures (must always pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run safety + emotion + db.journal tests
        run: python scripts/checks.py safety

  stress:
    # Repite las suites críticas para cazar flakiness. Solo corre en la
    # agenda semanal o a mano (workflow_dispatch) — no bloquea PRs.
    name: stress (weekly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run stress cycles
        run: python scripts/checks.py stress --stress-runs 3
