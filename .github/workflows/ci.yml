name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        env:
          # Force fake LLM and skip vault lookups.
          ANTHROPIC_API_KEY: ""
          OBSIDIAN_VAULT_PATH: ./this-path-does-not-exist
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

  safety-fixtures:
    # Tests del detector de crisis nunca pueden regresionar.
    # Job dedicado para que un fallo aquí sea visible y bloquee el merge
    # incluso si alguien afloja `--cov-fail-under`.
    name: safety fixtures (must always pass)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run safety + emotion + db.journal tests
        run: |
          pytest -v \
            tests/test_safety_detector.py \
            tests/test_safety_protocol.py \
            tests/test_safety_responses.py \
            tests/test_safety_resources.py \
            tests/test_safety_protocol_with_journal.py \
            tests/test_emotion_types.py \
            tests/test_db_journal.py
